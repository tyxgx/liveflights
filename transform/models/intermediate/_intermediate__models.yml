version: 2

models:
  - name: int_dim_airline
    description: >
      Airline dimension built from distinct airline names observed in
      stg_airline_activity, with a stable surrogate key
      (macros/generate_surrogate_key.sql).
    columns:
      - name: airline_key
        description: Deterministic md5 surrogate key over airline_name.
        tests: [not_null, unique]
      - name: airline_name
        description: Airline name resolved upstream from the callsign's ICAO prefix.
        tests: [not_null, unique]
      - name: is_unclassified
        description: True when airline_name is the "Unknown/Other" fallback bucket.
        tests: [not_null]

  - name: int_dim_country
    description: >
      Country dimension built from distinct origin countries observed in
      stg_traffic_by_country, enriched with a coarse region bucket
      (macros/country_to_region.sql) for the region-summary mart.
    columns:
      - name: country_key
        description: Deterministic md5 surrogate key over origin_country.
        tests: [not_null, unique]
      - name: origin_country
        description: Country inferred from the aircraft's ICAO24 address block.
        tests: [not_null, unique]
      - name: region
        description: >
          Coarse business-level region bucket (Europe / North America /
          South Asia / Other).
        tests:
          - not_null
          - accepted_values:
              values: ["Europe", "North America", "South Asia", "Other"]
