name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/terraform

jobs:
  # CI is intentionally lint+test only — there is no plan/apply/deploy job.
  # This project's Terraform state is local-only on purpose (see
  # versions.tf: a remote S3 backend + lock table would cost a small
  # always-on amount, undesirable for a $5-budget demo). That means a CI
  # runner always starts from an empty state and has no way to know what
  # already exists in AWS, so `terraform apply` there tries to recreate
  # every resource from scratch — it doesn't fail quietly, it fails loudly
  # with AccessDenied/AlreadyExists on almost everything, since the
  # github_actions IAM role is (deliberately) scoped to only ECR push + S3
  # site sync + one Lambda's code update, not full infra CRUD.
  #
  # Fixing that properly needs a remote backend (real, if small, monthly
  # cost) and a much broader IAM role for anything with write access to
  # this repo's main branch (a real security tradeoff for a personal
  # project). Not worth it here — infra changes are applied manually
  # (`terraform apply`, verified against live AWS afterward) instead, same
  # as every infra change this project has ever made. See
  # docs/aws-architecture.md and infra/terraform/iam.tf's github_actions
  # role for the (currently unused, but harmless to leave) OIDC plumbing,
  # kept in case a real remote-state + broader-IAM setup is worth it later.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
