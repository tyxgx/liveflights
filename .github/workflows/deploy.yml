name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/terraform

jobs:
  # CI is intentionally lint+test only — there is no plan/apply/deploy job.
  # This project's Terraform state is local-only on purpose (see
  # versions.tf: a remote S3 backend + lock table would cost a small
  # always-on amount, undesirable for a $5-budget demo). That means a CI
  # runner always starts from an empty state and has no way to know what
  # already exists in AWS, so `terraform apply` there tries to recreate
  # every resource from scratch — it doesn't fail quietly, it fails loudly
  # with AccessDenied/AlreadyExists on almost everything, since the
  # github_actions IAM role is (deliberately) scoped to only ECR push + S3
  # site sync + one Lambda's code update, not full infra CRUD.
  #
  # Fixing that properly needs a remote backend (real, if small, monthly
  # cost) and a much broader IAM role for anything with write access to
  # this repo's main branch (a real security tradeoff for a personal
  # project). Not worth it here — infra changes are applied manually
  # (`terraform apply`, verified against live AWS afterward) instead, same
  # as every infra change this project has ever made. See
  # docs/aws-architecture.md and infra/terraform/iam.tf's github_actions
  # role for the (currently unused, but harmless to leave) OIDC plumbing,
  # kept in case a real remote-state + broader-IAM setup is worth it later.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  terraform:
    # Static checks only: no AWS credentials, no plan/apply (see the note above
    # the test job for why CI never applies infra).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}
      - run: terraform init -backend=false -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}
      - run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

  dbt:
    # `dbt parse` compiles every model/test/ref without touching a database, so
    # broken SQL/Jinja/refs fail here. The env vars are placeholders only.
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dbt
      - run: uv run --group dbt dbt parse --project-dir transform --profiles-dir transform

  api-image:
    # Build only (never pushed): catches a broken Dockerfile/requirements
    # before it reaches the Lambda container image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -f api/cloud/Dockerfile -t liveflights-api:ci .

  audit:
    # Python deps are a hard gate (clean today). The frontend report is
    # informational: Next 14.x advisories need a Next 15 major upgrade and mostly
    # target the Next *server*, which a static S3 export does not run
    # (see docs/security.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv export --frozen --no-hashes --no-emit-project > /tmp/req.txt
      - run: uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip
      - run: uvx pip-audit -r api/cloud/requirements.txt --no-deps --disable-pip
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Frontend audit (report only)
        working-directory: web
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

