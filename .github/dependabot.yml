version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /api/cloud
    schedule: {interval: weekly}
