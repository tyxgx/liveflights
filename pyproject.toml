[project]
name = "liveflights"
version = "0.1.0"
description = "Real-Time Flight Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "confluent-kafka>=2.6.0",
  "httpx>=0.27",
  "structlog>=24.4",
  "orjson>=3.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]
streaming = [
  "pyspark==3.5.3",
  "delta-spark==3.2.1",
  "psycopg2-binary>=2.9",
  "pygeohash>=1.2.0",
]
dbt = [
  "dbt-core>=1.8,<1.9",
  "dbt-postgres>=1.8,<1.9",
]
ml = [
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "numpy>=1.26",
  "mlflow>=2.17,<2.18",
  "matplotlib>=3.9",
  "psycopg2-binary>=2.9",
  "boto3>=1.35",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "redis>=5.1",
  "prometheus-client>=0.21",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "numpy>=1.26",
  "mlflow>=2.17,<2.18",
  "joblib>=1.4",
  "boto3>=1.35",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]
