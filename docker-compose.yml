name: liveflights

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: liveflights-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [liveflights]

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: liveflights-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8090:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [liveflights]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: liveflights-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [liveflights]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: liveflights-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${MINIO_BUCKET:-liveflights} &&
      mc anonymous set download local/${MINIO_BUCKET:-liveflights} || true
      "
    networks: [liveflights]

  postgres:
    image: postgres:16-alpine
    container_name: liveflights-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liveflights}
      POSTGRES_USER: ${POSTGRES_USER:-liveflights}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liveflights}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liveflights} -d ${POSTGRES_DB:-liveflights}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [liveflights]

  redis:
    image: redis:7-alpine
    container_name: liveflights-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [liveflights]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: liveflights-mlflow
    working_dir: /mlflow
    entrypoint: >
      /bin/sh -c "
      pip install --no-cache-dir boto3 psycopg2-binary >/dev/null &&
      mlflow server
      --host 0.0.0.0 --port 5500
      --backend-store-uri postgresql://${POSTGRES_USER:-liveflights}:${POSTGRES_PASSWORD:-liveflights}@postgres:5432/${POSTGRES_DB:-liveflights}
      --default-artifact-root s3://${MINIO_BUCKET:-liveflights}/mlflow
      --serve-artifacts
      "
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "5500:5500"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5500/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [liveflights]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: liveflights-prometheus
    volumes:
      - ./infra/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [liveflights]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: liveflights-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks: [liveflights]

networks:
  liveflights:
    name: liveflights

volumes:
  redpanda-data:
  minio-data:
  postgres-data:
  prometheus-data:
  grafana-data:
